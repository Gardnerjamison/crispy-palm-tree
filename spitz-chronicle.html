<title>SPITZ CHRONICLE — Bark of Time</title>
<!--
  SPITZ CHRONICLE: BARK OF TIME  (vertical slice, 16-bit edition)
  A Chrono Trigger-style JRPG set in the world of Spitz Siege.
  Single file, no dependencies. 960x540 internal canvas, TILE=32.

  Controls:
    Arrows / WASD ... move & menu navigation
    Z / Enter ....... confirm, talk, interact
    X / Esc ......... cancel

  Two eras of the same valley: the peaceful Festival Era, and the
  Great Siege two hundred years earlier, reached via the Bonehenge.
  Houses are enterable in the Festival Era. Recruit Akamaru, fight
  the Whisker Company, fell the Cursed Stone Sentinel, and come home.
-->
<style>
  html,body{margin:0;padding:0;height:100%;background:#070410;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#070410;}
</style>

const VIEW_W=960, VIEW_H=540, T=32, MW=60, MH=16, WORLD_W=MW*T, WORLD_H=MH*T;
const WOY=(VIEW_H-WORLD_H)/2;  // world render offset (world is shorter than view)
const cv=document.getElementById('c'), g=cv.getContext('2d');
function fit(){
  const s=Math.min(innerWidth/VIEW_W,innerHeight/VIEW_H);
  cv.style.width=(VIEW_W*s)+'px'; cv.style.height=(VIEW_H*s)+'px';
}
addEventListener('resize',fit); fit();
const R=(x,y,w,h,c)=>{ g.fillStyle=c; g.fillRect(x,y,w,h); };

// ============================== INPUT ==============================
const keys={}, hit={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',Enter:'a',Space:'a',KeyX:'b',Escape:'b'};
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code]; if(!k) return;
  if(!keys[k]) hit[k]=true;
  keys[k]=true; e.preventDefault(); audioInit();
});
addEventListener('keyup',e=>{ const k=KEYMAP[e.code]; if(k) keys[k]=false; });
function pr(k){ return !!hit[k]; }

// ============================== AUDIO ==============================
let AC=null;
function audioInit(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(f,d,type,vol){
  if(!AC) return;
  const o=AC.createOscillator(), gn=AC.createGain();
  o.type=type||'square'; o.frequency.value=f;
  gn.gain.setValueAtTime(vol||0.05,AC.currentTime);
  gn.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
  o.connect(gn); gn.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+d);
}
const sfx={
  cursor(){ beep(660,0.05,'square',0.03); },
  ok(){ beep(880,0.07,'square',0.04); },
  cancel(){ beep(300,0.08,'square',0.03); },
  hitS(){ beep(180,0.12,'sawtooth',0.06); },
  tech(){ beep(520,0.2,'triangle',0.06); beep(780,0.25,'triangle',0.05); },
  heal(){ beep(700,0.15,'sine',0.05); beep(1050,0.2,'sine',0.05); },
  door(){ beep(420,0.1,'triangle',0.05); beep(320,0.12,'triangle',0.04); },
  chest(){ beep(523,0.1,'square',0.05); setTimeout(()=>beep(784,0.18,'square',0.05),100); },
  gate(){ beep(220,0.5,'sine',0.06); beep(330,0.5,'sine',0.05); beep(440,0.6,'sine',0.04); },
  win(){ beep(523,0.12,'square',0.05); setTimeout(()=>beep(659,0.12,'square',0.05),120); setTimeout(()=>beep(784,0.25,'square',0.05),240); },
  lose(){ beep(200,0.4,'sawtooth',0.05); setTimeout(()=>beep(150,0.6,'sawtooth',0.05),300); },
};

(function loadMaps(){
  for(let y=0;y<MH;y++){
    const row=(WORLDSRC[y]||'').replace(/[ oG]/g,'.').padEnd(MW,'.').slice(0,MW).split('');
    row[0]='t'; row[MW-1]='t';
    if(y===0||y===MH-1) row.fill('t');
    MAPS.world.grid.push(row);
  }
  const m=MAPS.world.grid;
  for(let y=HENGE.cy-4;y<=HENGE.cy+4;y++)
    for(let x=HENGE.cx-4;x<=HENGE.cx+4;x++)
      if(y>0&&y<MH-1&&x>0&&x<MW-1&&m[y][x]!=='p') m[y][x]='.';
  [[0,-3],[-2,-2],[2,-2],[3,0],[-2,2],[2,2],[0,3]].forEach(([dx,dy])=>{ m[HENGE.cy+dy][HENGE.cx+dx]='o'; });
  m[HENGE.cy][HENGE.cx]='G';
  for(let x=HENGE.cx-4;x<HENGE.cx;x++) m[HENGE.cy][x]='p';
  ['cottage','lodge'].forEach(k=>{ MAPS[k].grid=MAPS[k].src.map(r=>r.split('')); });
})();
const SOLID={t:1,w:1,h:1,r:1,d:1,f:1,o:1,S:1,W:1,B:1,C:1,b:1};
let curMap='world';
function tileAt(px,py){
  const M=MAPS[curMap];
  const tx=Math.floor(px/T), ty=Math.floor(py/T);
  if(tx<0||ty<0||tx>=M.w||ty>=M.h) return curMap==='world'?'t':'W';
  return M.grid[ty][tx];
}
function solidAt(px,py){ return !!SOLID[tileAt(px,py)]; }

  });

// ============================== SPRITES ==============================
// Sprite rects are buffered so a 1px dark outline pass can be drawn first
// (the classic 16-bit look), then the fills on top. Detail rects (eyes,
// markings) are flagged to skip the outline.
let SPR=[];
function sp(x,y,w,h,c,noOut){ SPR.push([x,y,w,h,c,noOut]); }
function flushSpr(u,oc){
  g.fillStyle=oc||'#171019';
  for(const r of SPR) if(!r[5]) g.fillRect(r[0]*u-1,r[1]*u-1,r[2]*u+2,r[3]*u+2);
  for(const r of SPR){ g.fillStyle=r[4]; g.fillRect(r[0]*u,r[1]*u,r[2]*u,r[3]*u); }
  SPR.length=0;
}
// Upright 16-bit style dog. 2px logical units, origin at feet.
function dogSprite(x,y,o,dir,step,sc){
  sc=sc||1;
  const fur=o.fur||FUR[o.breed]||'#c08050', wear=o.wear||'#555';
  const dk=shade(fur,-45), lt=shade(fur,35);
  const wd=shade(wear,-45), wl=shade(wear,28);
  g.save(); g.translate(Math.round(x),Math.round(y)); g.scale(sc,sc);
  if(dir==='left') g.scale(-1,1);
  const side=(dir==='left'||dir==='right');
  const u=2, P=sp;
  // shadow (no outline)
  g.fillStyle='rgba(0,0,0,0.3)'; g.fillRect(-12,-3,24,4); g.fillRect(-8,-5,16,2);
  // 4-frame walk cycle: contact / pass / contact / pass
  const moving=step>0;
  const f4=Math.floor(step*8)%4;
  const B=moving&&(f4===1||f4===3)?-1:0;          // body bob on passing frames
  const sA=moving?[2,0,-2,0][f4]:0;               // front leg stride
  const sB=-sA;
  const wag=Math.round(Math.sin(tGlobal*5+(o.id==='aka'?2:0)));
  // tail & sword drawn first, behind the body
  if(o.breed==='shiba'||o.breed==='laika'||o.breed==='chow'){
    P(-8,-15+B+(wag>0?-1:0),3,4,fur); P(-8,-15+B+(wag>0?-1:0),3,1,lt,1);
  } else if(o.breed!=='bulldog'){
    P(-9,-12+B+wag,3,2,fur); P(-8,-10+B+wag,2,3,fur);
  }
  if(o.sword){ P(-7,-22+B,2,10,'#9aa0b2'); P(-7,-23+B,3,2,'#e8c050'); P(-7,-13+B,3,2,'#5a3a1e'); }
  // legs
  if(side){
    P(-5+sB,-5,4,5,dk);  P(-5+sB,-2,4,2,shade(fur,-60),1);
    P(2+sA,-5,4,5,fur);  P(2+sA,-2,4,2,dk,1);
  } else {
    const lA=moving&&f4===1?1:0, lB=moving&&f4===3?1:0;
    P(-5,-5,4,5-lA,fur); P(-5,-2-lA,4,2,dk,1);
    P(2,-5,4,5-lB,fur);  P(2,-2-lB,4,2,dk,1);
  }
  // body / tunic (3-tone)
  P(-6,-13+B,12,9,wear);
  P(-6,-13+B,3,9,wl,1);
  P(3,-13+B,3,9,wd,1);
  P(-6,-13+B,12,1,wl,1);
  P(-6,-6+B,12,2,wd,1);
  P(-6,-8+B,12,1,'#3a2c14',1); P(-1,-8+B,2,1,'#e8c050',1);  // belt + buckle
  // arms (swing opposite the stride in side view)
  if(side){ const aw=moving?-sA/2:0; P(3+aw,-12+B,3,5,fur); P(3+aw,-9+B,3,2,dk,1); }
  else { P(-8,-12+B,2,5,fur); P(6,-12+B,2,5,fur); P(-8,-9+B,2,2,dk,1); P(6,-9+B,2,2,dk,1); }
  // head (3-tone)
  const hx=side?-3:-5;
  if(o.breed==='chow') P(hx-2,-22+B,14,10,dk);
  P(hx,-21+B,10,8,fur);
  P(hx,-21+B,10,2,lt,1);
  P(hx,-21+B,2,8,lt,1);
  P(hx+8,-21+B,2,8,dk,1);
  // ears
  if(o.breed==='corgi'){
    P(hx-1,-27+B,4,7,fur); P(hx+7,-27+B,4,7,fur);
    P(hx,-26+B,2,5,'#5a2a18',1); P(hx+8,-26+B,2,5,'#5a2a18',1);
  } else if(o.breed==='shiba'){
    P(hx,-25+B,3,5,fur); P(hx+7,-25+B,3,5,fur);
    P(hx+1,-24+B,1,3,'#7a3018',1); P(hx+8,-24+B,1,3,'#7a3018',1);
  } else if(o.breed==='bulldog'){
    P(hx-1,-22+B,2,3,dk); P(hx+9,-22+B,2,3,dk);
  } else if(o.breed==='laika'){
    P(hx,-26+B,3,5,fur); P(hx+7,-26+B,3,5,fur);
    P(hx+1,-25+B,1,3,dk,1); P(hx+8,-25+B,1,3,dk,1);
  } else if(o.breed==='pwd'){
    P(hx-1,-23+B,2,7,dk); P(hx+9,-23+B,2,7,dk);
    P(hx+1,-23+B,3,2,dk); P(hx+5,-24+B,3,2,dk);
  } else if(o.breed==='chow'){
    P(hx,-24+B,2,2,dk); P(hx+8,-24+B,2,2,dk);
  }
  // face
  if(dir!=='up'){
    if(side){
      P(hx+7,-18+B,4,4,fur); P(hx+7,-18+B,4,1,lt,1);
      P(hx+10,-17+B,1,2,'#14080a',1);
      P(hx+5,-19+B,2,2,'#14080a',1); P(hx+5,-19+B,1,1,'#fff',1);
      if(o.breed==='corgi') P(hx+6,-21+B,2,7,'#f0e8d8',1);
      if(o.breed==='shiba') P(hx+6,-16+B,3,3,'#f0e0c8',1);
    } else {
      P(-2,-17+B,4,4,fur); P(-2,-17+B,4,1,lt,1);
      P(-1,-15+B,2,2,'#14080a',1);
      P(hx+2,-19+B,2,2,'#14080a',1); P(hx+6,-19+B,2,2,'#14080a',1);
      P(hx+2,-19+B,1,1,'#fff',1);   P(hx+6,-19+B,1,1,'#fff',1);
      if(o.breed==='corgi') P(-1,-21+B,2,4,'#f0e8d8',1);
      if(o.breed==='shiba'){ P(hx+1,-16+B,2,2,'#f0e0c8',1); P(hx+7,-16+B,2,2,'#f0e0c8',1); }

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, gr=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); gr=Math.max(0,Math.min(255,gr)); b=Math.max(0,Math.min(255,b));
  return 'rgb('+r+','+gr+','+b+')';
}

function tileAt2(tx,ty){
  const M=MAPS[curMap];
  if(tx<0||ty<0||tx>=M.w||ty>=M.h) return ' ';
  return M.grid[ty][tx];
}

// ============================== WORLD ==============================
function setCam(){
  const M=MAPS[curMap];
  if(curMap==='world'){
    camX=Math.max(0,Math.min(WORLD_W-VIEW_W, player.x-VIEW_W/2));
    camY=-WOY;
  } else {
    camX=-(VIEW_W-M.w*T)/2; camY=-(VIEW_H-M.h*T)/2;
  }
}
function enterHouse(key){
  const dest=DOORS[key];
  if(era==='siege'){
    if(interactCd<=0){ interactCd=0.6; toast('The doorway is choked with flame.'); }
    return;
  }
  sfx.door();
  const [dx,dy]=key.split(',').map(Number);
  doorReturn={x:dx*T+T/2, y:(dy+1)*T+T/2};
  fadeDir=1;
  setTimeout(()=>{
    curMap=dest;
    const M=MAPS[dest];
    for(let y=M.h-1;y>0;y--) for(let x=0;x<M.w;x++)
      if(M.grid[y][x]==='E'){ player.x=x*T+T/2; player.y=y*T-6; }
    player.dir='up'; interactCd=0.4; fadeDir=-1;
  },250);
}
function leaveHouse(){
  sfx.door();
  fadeDir=1;
  setTimeout(()=>{
    curMap='world';
    player.x=doorReturn.x; player.y=doorReturn.y; player.dir='down';
    interactCd=0.4; fadeDir=-1;
  },250);
}
function openChest(){
  if(curMap==='cottage' && !flags.chestCottage){
    flags.chestCottage=true; addItem('biscuit',1); sfx.chest();
    say('CHEST',["Found a SALT BISCUIT! Gran's cure for most things. Curses included."]);
  } else if(curMap==='lodge' && !flags.chestLodge){
    flags.chestLodge=true; addItem('kibble',2); gold+=20; sfx.chest();
    say('CHEST',["Found 2x KIBBLE and 20 GOLD tucked under the floor mat ledger."]);
  } else {
    say('CHEST',["Empty. Even the crumbs are gone."]);
  }
}
function updateWorld(dt){
  let dx=0,dy=0;
  if(keys.left)dx=-1; if(keys.right)dx=1; if(keys.up)dy=-1; if(keys.down)dy=1;
  player.moving=!!(dx||dy);
  if(dx) player.dir=dx<0?'left':'right';
  else if(dy) player.dir=dy<0?'up':'down';
  if(player.moving){
    const sp=160*dt, nx=player.x+dx*sp, ny=player.y+dy*sp;
    const hw=8, hh=5;
    const cor=[[nx-hw,player.y],[nx+hw,player.y],[nx-hw,player.y+hh],[nx+hw,player.y+hh]];
    if(cor.every(([cx,cy])=>!solidAt(cx,cy))) player.x=nx;
    else if(curMap==='world'){
      const dk=doorKeyAt(cor); if(dk) { enterHouse(dk); return; }
    }
    const cor2=[[player.x-hw,ny],[player.x+hw,ny],[player.x-hw,ny+hh],[player.x+hw,ny+hh]];
    if(cor2.every(([cx,cy])=>!solidAt(cx,cy))) player.y=ny;
    else if(curMap==='world'){
      const dk=doorKeyAt(cor2); if(dk) { enterHouse(dk); return; }
    }
    const M=MAPS[curMap];
    player.x=Math.max(12,Math.min(M.w*T-12,player.x));
    player.y=Math.max(36,Math.min(M.h*T-6,player.y));
    player.step+=dt*1.6;
  }
  setCam();
  if(interactCd>0) interactCd-=dt;

  if(curMap!=='world' && tileAt(player.x,player.y)==='E' && interactCd<=0){ leaveHouse(); return; }

  if(curMap==='world' && era==='siege'){
    worldFoes.forEach(f=>{
      if(f.dead||f.boss) return;
      f.x+=f.dir*26*dt;
      if(solidAt(f.x+f.dir*16,f.y)||Math.random()<0.004) f.dir*=-1;
      const d=Math.hypot(f.x-player.x,f.y-player.y);
      if(d<26) triggerBattle(f);
    });
    // Akamaru steps into your path on his own
    const aka=NPCS.siege.find(n=>n.auto);
    if(aka && Math.hypot(aka.x-player.x,aka.y-player.y)<3.5*T){
      sfx.ok(); say(aka.name, aka.lines(), ()=>{ if(aka.after) aka.after(); });
      return;
    }
    const b=worldFoes.find(f=>f.boss&&!f.dead);
    if(b && Math.hypot(b.x-player.x,b.y-player.y)<52){
      say('CURSED SENTINEL',["GRRRRND. THE STONE REMEMBERS THE SIEGE.","NONE PASS TO THE HENGE. NONE GO HOME."],
        ()=>triggerBattle(b));
      return;
    }
  }

  const near=npcsNow().find(n=>Math.hypot(n.x-player.x,n.y-player.y)<44);
  const onGate=curMap==='world'&&tileAt(player.x,player.y)==='G';
  const facing=facingTile();
  if(pr('a') && interactCd<=0){
    if(near){
      sfx.ok();
      say(near.name, near.lines(), ()=>{ if(near.after) near.after(); });
    } else if(onGate){
      useGate();
    } else if(facing==='C'){
      openChest();
    } else if(facing==='B'){
      sfx.heal(); healParty();
      say('PIP',["A quick nap before the fireworks... Zzz.","The party is fully rested!"]);
    }
  }
}
function doorKeyAt(corners){
  for(const [cx,cy] of corners){
    if(tileAt(cx,cy)==='d'){
      const k=Math.floor(cx/T)+','+Math.floor(cy/T);
      if(DOORS[k]) return k;
    }
  }
  return null;
}
function facingTile(){
  const dx=player.dir==='left'?-T*0.7:player.dir==='right'?T*0.7:0;
  const dy=player.dir==='up'?-T*0.7:player.dir==='down'?T*0.7:0;
  return tileAt(player.x+dx,player.y+dy);
}
function useGate(){

}
function doSwap(){
  fadeDir=1; mode='swap';
  setTimeout(()=>{
    era = era==='present'?'siege':'present';

}
function triggerBattle(f){

// ============================== BATTLE ==============================
function startBattle(group, srcFoe){
  const foes=group.map((id,i)=>{
    const d=ENEMYDEF[id];
    return {d, hp:d.hp, max:d.hp, atb:Math.random()*0.3, dead:false, hurt:0, lunge:0, acts:0,
      x:210+(i%2)*100, y:270+i*80};
  });
  if(group.length===1) foes[0].y=320;
  if(group[0]==='sentinel'){ foes[0].x=230; foes[0].y=380; }
  party.forEach((p,i)=>{ p.atb=Math.random()*0.2; p.lunge=0; p.hurt=0; p.bx=730+i*50; p.by=300+i*80; });
  battle={foes, srcFoe, menu:null, act:null, popups:[], sparks:[], result:null, resultT:0, shake:0, flash:0};
  mode='battle';
}
function alive(arr){ return arr.filter(u=>!u.dead&&u.hp>0); }
function popup(x,y,txt,col){ battle.popups.push({x,y,txt,col,t:1}); }
function spark(x,y,col){ for(let i=0;i<8;i++) battle.sparks.push({x,y,vx:(Math.random()-0.5)*220,vy:(Math.random()-0.7)*220,t:0.4,col}); }

function calcDmg(atk,mult){
  let d=atk*mult*(0.85+Math.random()*0.3);
  if(Math.random()<0.1){ d*=1.6; return {d:Math.round(d),crit:true}; }
  return {d:Math.round(d),crit:false};
}
function queueAct(src,tgts,kind,info){
  battle.act={src,tgts,kind,info,t:0,dur:0.55,applied:false};
  battle.menu=null;
}
function applyAct(){
  const a=battle.act;
  if(a.kind==='attack'||a.kind==='tech'){
    const mult=a.kind==='attack'?1:a.info.mult;
    a.tgts.forEach(tg=>{
      const r=calcDmg(a.src.atk,mult);
      tg.hp-=r.d; tg.hurt=0.35;
      popup(tg.x||tg.bx,(tg.y||tg.by)-60,r.d+(r.crit?'!':''),r.crit?'#ffd040':'#fff');
      spark(tg.x||tg.bx,(tg.y||tg.by)-30,a.kind==='tech'?'#80c0ff':'#fff0a0');
      if(tg.hp<=0){ tg.hp=0; tg.dead=true; }
    });
    if(a.kind==='tech'){ sfx.tech(); battle.flash=0.25; } else sfx.hitS();
    battle.shake=a.kind==='tech'?7:4;
  } else if(a.kind==='dual'){
    const dmg=(party[0].atk+party[1].atk)*1.7;
    a.tgts.forEach(tg=>{
      const r=calcDmg(dmg,1);
      tg.hp-=r.d; tg.hurt=0.4;
      popup(tg.x,tg.y-66,r.d+(r.crit?'!':''),'#ff8030');
      spark(tg.x,tg.y-30,'#ff8030');
      if(tg.hp<=0){ tg.hp=0; tg.dead=true; }
    });
    sfx.tech(); battle.shake=10; battle.flash=0.4;
  } else if(a.kind==='item'){
    const it=ITEMDEF[a.info.id];
    a.tgts.forEach(tg=>{
      tg.hp=Math.min(tg.max,tg.hp+it.heal);
      popup(tg.bx,tg.by-60,'+'+it.heal,'#60e080');
      spark(tg.bx,tg.by-30,'#60e080');
    });
    sfx.heal();
  } else if(a.kind==='ehit'){
    a.tgts.forEach(tg=>{
      const r=calcDmg(a.src.d.atk,a.info.mult||1);
      tg.hp-=r.d; tg.hurt=0.35;
      popup(tg.bx,tg.by-60,r.d+(r.crit?'!':''),'#ff7070');
      spark(tg.bx,tg.by-30,'#ff7070');
      if(tg.hp<=0){ tg.hp=0; tg.dead=true; }
    });
    sfx.hitS(); battle.shake=4;
  }
}
function endAct(){
  const a=battle.act;
  if(a.kind==='dual'){ party[0].atb=0; party[1].atb=0;
    party[0].mp-=DUAL.mp; party[1].mp-=DUAL.mp; }
  else {
    a.src.atb=0;
    if(a.kind==='tech') a.src.mp-=a.info.mp;
  }
  if(a.kind==='ehit') a.src.acts++;
  battle.act=null;
  if(!alive(battle.foes).length){
    const xp=battle.foes.reduce((s,f)=>s+f.d.xp,0), gd=battle.foes.reduce((s,f)=>s+f.d.gold,0);
    battle.result={win:true,xp,gd}; battle.resultT=0; sfx.win();
  } else if(!alive(party).length){
    battle.result={win:false}; battle.resultT=0; sfx.lose();
  }
}
function openMenu(who){
  const opts=[{id:'attack',label:'ATTACK'}];
  const tech=TECH[who.id];
  opts.push({id:'tech',label:tech.name,dis:who.mp<tech.mp,sub:tech.mp+'MP'});
  if(party.length>1){
    const other=party.find(p=>p!==who);
    const ready=other&&!other.dead&&other.hp>0&&other.atb>=1&&other.mp>=DUAL.mp&&who.mp>=DUAL.mp;
    opts.push({id:'dual',label:'DUAL: '+DUAL.name,dis:!ready,sub:DUAL.mp+'MP EA'});
  }
  opts.push({id:'item',label:'ITEM',dis:!Object.keys(inv).some(k=>inv[k]>0)});
  battle.menu={who,opts,idx:0,stage:'root',tIdx:0,items:null};
  flags.battleHint=true;
}
function updateBattle(dt){
  battle.popups.forEach(p=>p.t-=dt); battle.popups=battle.popups.filter(p=>p.t>0);
  battle.sparks.forEach(s=>{ s.t-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=400*dt; });
  battle.sparks=battle.sparks.filter(s=>s.t>0);
  battle.foes.forEach(f=>{ if(f.hurt>0)f.hurt-=dt; });
  party.forEach(p=>{ if(p.hurt>0)p.hurt-=dt; });
  if(battle.shake>0) battle.shake=Math.max(0,battle.shake-dt*26);
  if(battle.flash>0) battle.flash-=dt;

  if(battle.result){
    battle.resultT+=dt;
    if(battle.resultT>0.8 && pr('a')){
      if(battle.result.win){
        giveXP(battle.result.xp); gold+=battle.result.gd;
        party.forEach(p=>{ if(p.hp>0) p.mp=Math.min(p.maxmp,p.mp+3); });
        if(battle.srcFoe){ battle.srcFoe.dead=true;
          if(battle.srcFoe.boss){ flags.bossDown=true;
            setTimeout(()=>say('AKAMARU',["...The stone sleeps. Your road home is open, festival-pup.","Touch the henge. And Pip — tell them the Siege had good dogs on every side."]),200); }
        }
        mode='world'; battle=null;
      } else {
        mode='gameover'; battle=null;
      }
      return;
    }
    return;
  }

  if(battle.act){
    const a=battle.act; a.t+=dt;
    a.src.lunge=Math.sin(Math.min(1,a.t/a.dur)*Math.PI)*24;
    if(!a.applied && a.t>=a.dur*0.5){ a.applied=true; applyAct(); }
    if(a.t>=a.dur){ a.src.lunge=0; endAct(); }
    return;
  }

  if(battle.menu){ menuInput(); return; }

  party.forEach(p=>{ if(!p.dead&&p.hp>0) p.atb=Math.min(1,p.atb+p.rate*dt*0.45); });
  battle.foes.forEach(f=>{ if(!f.dead) f.atb=Math.min(1,f.atb+f.d.rate*dt*0.4); });

  const ef=battle.foes.find(f=>!f.dead&&f.atb>=1);
  if(ef){ enemyAct(ef); return; }
  const rp=party.find(p=>!p.dead&&p.hp>0&&p.atb>=1);
  if(rp) openMenu(rp);
}
function enemyAct(f){
  const ts=alive(party);
  if(!ts.length) return;
  if(f.d.boss && f.acts%3===2){
    queueAct(f,ts.slice(),'ehit',{mult:0.7});
  } else if(f.d.bomber && Math.random()<0.3){
    queueAct(f,ts.slice(),'ehit',{mult:0.5});
  } else {
    queueAct(f,[ts[Math.floor(Math.random()*ts.length)]],'ehit',{});
  }
}
function menuInput(){
  const m=battle.menu;
  if(m.stage==='root'){
    if(pr('up')){ m.idx=(m.idx+m.opts.length-1)%m.opts.length; sfx.cursor(); }
    if(pr('down')){ m.idx=(m.idx+1)%m.opts.length; sfx.cursor(); }
    if(pr('a')){
      const o=m.opts[m.idx];
      if(o.dis){ sfx.cancel(); return; }
      sfx.ok();
      if(o.id==='attack'){ m.stage='target'; m.tIdx=0; m.pend={kind:'attack'}; }
      else if(o.id==='tech'){
        const tch=TECH[m.who.id];
        if(tch.target==='all') queueAct(m.who,alive(battle.foes),'tech',tch);
        else { m.stage='target'; m.tIdx=0; m.pend={kind:'tech',info:tch}; }
      }
      else if(o.id==='dual'){ queueAct(m.who,alive(battle.foes),'dual',{}); }
      else if(o.id==='item'){
        m.items=Object.keys(inv).filter(k=>inv[k]>0);
        m.stage='item'; m.idx2=0;
      }
    }
  } else if(m.stage==='target'){
    const ts=alive(battle.foes);
    if(!ts.length){ m.stage='root'; return; }
    m.tIdx=Math.min(m.tIdx,ts.length-1);
    if(pr('up')||pr('left')){ m.tIdx=(m.tIdx+ts.length-1)%ts.length; sfx.cursor(); }
    if(pr('down')||pr('right')){ m.tIdx=(m.tIdx+1)%ts.length; sfx.cursor(); }
    if(pr('b')){ m.stage='root'; sfx.cancel(); }
    if(pr('a')){
      sfx.ok();
      if(m.pend.kind==='attack') queueAct(m.who,[ts[m.tIdx]],'attack',{});
      else queueAct(m.who,[ts[m.tIdx]],'tech',m.pend.info);
    }
  } else if(m.stage==='item'){
    if(!m.items.length){ m.stage='root'; return; }
    m.idx2=Math.min(m.idx2,m.items.length-1);
    if(pr('up')){ m.idx2=(m.idx2+m.items.length-1)%m.items.length; sfx.cursor(); }
    if(pr('down')){ m.idx2=(m.idx2+1)%m.items.length; sfx.cursor(); }
    if(pr('b')){ m.stage='root'; sfx.cancel(); }
    if(pr('a')){ sfx.ok(); m.pendItem=m.items[m.idx2]; m.stage='ally'; m.aIdx=0; }
  } else if(m.stage==='ally'){
    const ts=alive(party);
    m.aIdx=Math.min(m.aIdx,ts.length-1);
    if(pr('up')||pr('down')){ m.aIdx=(m.aIdx+1)%ts.length; sfx.cursor(); }
    if(pr('b')){ m.stage='item'; sfx.cancel(); }
    if(pr('a')){
      sfx.ok(); inv[m.pendItem]--;
      queueAct(m.who,[ts[m.aIdx]],'item',{id:m.pendItem});
    }
  }
}
function drawBattle(){
  const shx=battle.shake?(Math.random()-0.5)*battle.shake:0;
  const shy=battle.shake?(Math.random()-0.5)*battle.shake:0;
  g.save(); g.translate(shx,shy);
  // burning valley backdrop with parallax silhouettes
  const grd=g.createLinearGradient(0,0,0,VIEW_H);
  grd.addColorStop(0,'#481420'); grd.addColorStop(0.45,'#2c1020'); grd.addColorStop(0.8,'#180a16');
  g.fillStyle=grd; g.fillRect(-12,-12,VIEW_W+24,VIEW_H+24);
  g.fillStyle='rgba(255,110,40,0.16)'; g.fillRect(-12,150,VIEW_W+24,60);
  for(let i=0;i<9;i++){
    const bx2=i*120-20, bw=58+((i*53)%60), bh=80+((i*37)%80);
    R(bx2,300-bh,bw,bh,'#221024');
    R(bx2+8,300-bh+6,10,8,'#0e0814');
    const f=Math.sin(tGlobal*7+i*2)*0.5+0.5;
    if(i%2){ g.fillStyle='rgba(255,'+(130+f*70|0)+',40,'+(0.35+f*0.3)+')';
      g.fillRect(bx2+bw*0.3,300-bh-10-f*8,10,12+f*8); }
  }
  R(-12,300,VIEW_W+24,VIEW_H,'#33283e');
  R(-12,300,VIEW_W+24,4,'#4a3c5c');
  for(let i=0;i<5;i++) R(-12,330+i*30,VIEW_W+24,2,'rgba(0,0,0,'+(0.08+i*0.05)+')');
  // units (enemies face right toward the party)
  battle.foes.forEach(f=>{
    if(f.dead) return;
    const fx=f.x+(battle.act&&battle.act.src===f?battle.act.src.lunge:0);
    if(f.d.boss) sentinelSprite(fx,f.y,tGlobal,f.hurt,1);
    else if(f.d.bomber) catSprite(fx,f.y,tGlobal,1,2,0);
    else houndSprite(fx,f.y,tGlobal,1,2,0);
    if(f.hurt>0){ g.fillStyle='rgba(255,120,120,0.3)';
      g.fillRect(fx-44,f.y-(f.d.boss?120:80),88,f.d.boss?128:88); }
    const r=f.hp/f.max;
    R(f.x-30,f.y+12,60,7,'#000');
    R(f.x-28,f.y+13,56*r,5, r>0.5?'#3a9a3a':r>0.25?'#c8a020':'#cc2020');
  });
  party.forEach(p=>{
    const px=p.bx-(p.lunge||0);
    if(p.hp<=0){
      g.save(); g.translate(px,p.by); g.rotate(-1.45); dogSprite(0,0,p,'left',0,2); g.restore();
    } else {
      dogSprite(px,p.by,p,'left',battle.act&&battle.act.src===p?tGlobal*3:0,2);
      if(p.hurt>0){ g.fillStyle='rgba(255,120,120,0.3)'; g.fillRect(px-30,p.by-66,60,72); }
    }
  });
  battle.sparks.forEach(s=>{ g.fillStyle=s.col; g.fillRect(s.x,s.y,4,4); });
  battle.popups.forEach(p=>{
    g.font='bold 18px monospace'; g.textAlign='center';
    g.fillStyle='#000'; g.fillText(p.txt,p.x+2,p.y-(1-p.t)*28+2);
    g.fillStyle=p.col; g.fillText(p.txt,p.x,p.y-(1-p.t)*28);
  });
  g.restore();
  if(battle.flash>0){ g.fillStyle='rgba(255,240,200,'+battle.flash+')'; g.fillRect(0,0,VIEW_W,VIEW_H); }

  // ---- command + status windows
  winBox(12,396,500,132);
  winBox(524,396,424,132);
  party.forEach((p,i)=>{
    const y=424+i*46;
    g.font='14px monospace'; g.textAlign='left';
    g.fillStyle=p.hp>0?'#fff':'#6a607e';
    g.fillText(p.name+'  LV'+p.lvl,544,y);
    g.fillStyle=C.ui; g.font='13px monospace';
    g.fillText('HP '+Math.max(0,p.hp)+'/'+p.max+'  MP '+p.mp,544,y+17);
    R(790,y-12,130,12,'#0a0a2a');
    R(792,y-10,126*Math.min(1,p.atb),8, p.atb>=1?'#f0d050':'#5a8fc8');
    g.fillStyle=C.dim; g.font='10px monospace'; g.fillText('ATB',792,y+10);
  });
  const m=battle.menu;
  g.textAlign='left';
  if(battle.result){
    if(battle.result.win){
      g.fillStyle=C.gold; g.font='bold 22px monospace';
      g.fillText('VICTORY!',36,432);
      g.font='14px monospace'; g.fillStyle='#fff';
      g.fillText('+'+battle.result.xp+' XP   +'+battle.result.gd+' GOLD',36,458);
      g.fillStyle=C.dim; g.fillText('Z: CONTINUE',36,488);
    } else {
      g.fillStyle='#e05050'; g.font='bold 20px monospace';
      g.fillText('THE PACK HAS FALLEN...',36,440);
      g.fillStyle=C.dim; g.font='14px monospace'; g.fillText('Z: CONTINUE',36,470);
    }
  } else if(m){
    g.fillStyle=C.gold; g.font='bold 14px monospace';
    g.fillText('⚔ '+m.who.name+"'S TURN",36,420);
    g.font='14px monospace';
    if(m.stage==='root'){
      m.opts.forEach((o,i)=>{
        g.fillStyle=o.dis?'#4a4468':(i===m.idx?'#fff':C.ui);
        g.fillText((i===m.idx?'▶ ':'  ')+o.label+(o.sub?'  ['+o.sub+']':''),36,442+i*19);
      });
    } else if(m.stage==='target'){
      g.fillStyle='#fff'; g.fillText('CHOOSE TARGET   (X: back)',36,446);
      const ts=alive(battle.foes), tg=ts[m.tIdx];
      if(tg){
        g.fillStyle=C.gold; g.font='bold 22px monospace'; g.textAlign='center';
        g.fillText('▼',tg.x,tg.y-(tg.d.boss?128:92)-Math.sin(tGlobal*6)*4);
        g.textAlign='left'; g.font='14px monospace';
        g.fillText('▶ '+tg.d.name,36,470);
      }
    } else if(m.stage==='item'){
      g.fillStyle='#fff'; g.fillText('ITEMS   (X: back)',36,438);
      m.items.forEach((id,i)=>{
        g.fillStyle=i===m.idx2?'#fff':C.ui;
        g.fillText((i===m.idx2?'▶ ':'  ')+ITEMDEF[id].name+' x'+inv[id]+'   '+ITEMDEF[id].desc,36,460+i*19);
      });
    } else if(m.stage==='ally'){
      g.fillStyle='#fff'; g.fillText('USE ON WHOM?   (X: back)',36,446);
      const ts=alive(party);
      g.fillStyle=C.gold; g.fillText('▶ '+ts[m.aIdx].name,36,470);
    }
  } else if(!flags.battleHint){
    g.fillStyle=C.dim; g.font='13px monospace';
    g.fillText('WAIT FOR THE GOLD ATB BAR TO FILL...',36,440);
    g.fillText('Z: CONFIRM   X: CANCEL   ARROWS: CHOOSE',36,462);
  }
}

// ============================== SCREENS ==============================
function drawTitle(){
  const grd=g.createLinearGradient(0,0,0,VIEW_H);
  grd.addColorStop(0,'#1c1240'); grd.addColorStop(0.6,'#120c28'); grd.addColorStop(1,'#0a0614');
  g.fillStyle=grd; g.fillRect(0,0,VIEW_W,VIEW_H);
  // stars
  for(let i=0;i<40;i++){
    const sx=(i*97)%VIEW_W, sy=(i*61)%220;
    g.fillStyle='rgba(255,255,255,'+(0.2+((i*7)%5)/10+Math.sin(tGlobal*2+i)*0.1)+')';
    g.fillRect(sx,sy,2,2);
  }
  R(VIEW_W-180,40,56,56,'#e8e2f2'); R(VIEW_W-168,52,12,12,'#c8c0dc'); R(VIEW_W-146,70,10,10,'#c8c0dc');
  // henge silhouette
  [[-110,0],[-58,-16],[0,-24],[58,-16],[110,0]].forEach(([dx,dy])=>{
    R(VIEW_W/2+dx-13,330+dy,26,80-dy,'#1e1834');
    R(VIEW_W/2+dx-13,330+dy,8,80-dy,'#161028');
  });
  const hum=0.4+Math.sin(tGlobal*2.5)*0.35;
  g.fillStyle='rgba(120,200,255,'+hum+')'; g.fillRect(VIEW_W/2-8,360,16,40);
  g.fillStyle='rgba(120,200,255,'+(hum*0.25)+')'; g.fillRect(VIEW_W/2-26,300,52,100);
  R(0,400,VIEW_W,VIEW_H,'#100a18');
  R(0,400,VIEW_W,3,'#241c38');
  dogSprite(VIEW_W/2-70,398,{breed:'corgi',fur:FUR.corgi,wear:'#2a7a3a'},'right',tGlobal*0.5,2.5);
  dogSprite(VIEW_W/2+70,398,{breed:'shiba',fur:FUR.shiba,wear:'#383a6a',sword:true},'left',tGlobal*0.5,2.5);
  g.textAlign='center';
  g.fillStyle='#000'; g.font='bold 52px monospace';
  g.fillText('SPITZ CHRONICLE',VIEW_W/2+3,143);
  g.fillStyle=C.gold; g.fillText('SPITZ CHRONICLE',VIEW_W/2,140);
  g.fillStyle='#f8edc8'; g.font='bold 52px monospace';
  g.save(); g.globalAlpha=0.25; g.fillText('SPITZ CHRONICLE',VIEW_W/2,137); g.restore();
  g.font='18px monospace'; g.fillStyle=C.ui;
  g.fillText('—  B A R K   O F   T I M E  —',VIEW_W/2,176);
  g.fillStyle=C.dim; g.font='14px monospace';
  g.fillText('A TALE OF THE SIX GREAT PACKS',VIEW_W/2,202);
  if(Math.sin(tGlobal*4)>-0.3){
    g.fillStyle='#fff'; g.font='bold 18px monospace';
    g.fillText('PRESS Z',VIEW_W/2,468);
  }
  g.fillStyle=C.dim; g.font='13px monospace';
  g.fillText('ARROWS/WASD MOVE · Z CONFIRM · X CANCEL',VIEW_W/2,505);
}
function drawPages(pages,title){
  R(0,0,VIEW_W,VIEW_H,'#06030e');
  g.textAlign='center';
  if(title){ g.fillStyle=C.gold; g.font='bold 18px monospace'; g.fillText(title,VIEW_W/2,110); }
  g.fillStyle='#d8d2e6'; g.font='16px monospace';
  wrapText(pages[pagei],VIEW_W/2,230,640,26,'center');
  g.fillStyle=C.dim; g.font='14px monospace';
  g.fillText('Z',VIEW_W/2,470);
}
function wrapText(txt,x,y,maxw,lh,align){
  g.textAlign=align||'left';
  const words=txt.split(' '); let line='', yy=y;
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(g.measureText(test).width>maxw){ g.fillText(line,x,yy); yy+=lh; line=w; }
    else line=test;
  });
  if(line) g.fillText(line,x,yy);
}
function drawDialog(){
  drawScene();
  const page=dlg.pages[dlg.pi];
  winBox(20,VIEW_H-150,VIEW_W-40,128);
  // name plate
  g.font='bold 14px monospace'; g.textAlign='left';
  const nw=g.measureText(dlg.name).width+24;
  winBox(40,VIEW_H-166,nw,30);
  g.fillStyle=C.gold; g.fillText(dlg.name,52,VIEW_H-145);
  g.fillStyle='#fff'; g.font='15px monospace';
  dlg.ci=Math.min(page.length,dlg.ci+1.6);
  wrapText(page.slice(0,Math.floor(dlg.ci)),44,VIEW_H-114,VIEW_W-110,22);
  if(dlg.ci>=page.length && Math.sin(tGlobal*5)>0){
    g.fillStyle=C.dim; g.textAlign='right'; g.fillText('Z ▼',VIEW_W-44,VIEW_H-40);
  }
}
function updateDialog(){
  const page=dlg.pages[dlg.pi];
  if(pr('a')){
    if(dlg.ci<page.length){ dlg.ci=page.length; }
    else {
      sfx.cursor();
      dlg.pi++; dlg.ci=0;
      if(dlg.pi>=dlg.pages.length){
        const done=dlg.done; dlg=null; interactCd=0.35;
        if(mode==='dialog') mode='world';
        if(done) done();
      }
    }
  }
}
function drawGameover(){
  R(0,0,VIEW_W,VIEW_H,'#0c0410');
  g.textAlign='center';
  g.fillStyle='#e05050'; g.font='bold 34px monospace';
  g.fillText('THE PACK HAS FALLEN',VIEW_W/2,220);
  g.fillStyle=C.dim; g.font='15px monospace';
  g.fillText('But the festival fires still burn, two hundred years away.',VIEW_W/2,280);
  g.fillStyle='#fff'; g.fillText('Z: WAKE UP IN WAGFORD',VIEW_W/2,340);
}

// ============================== MAIN LOOP ==============================
let last=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-last)/1000)||0.016; last=ts; tGlobal+=dt;
  if(toastT>0) toastT-=dt;
  if(fadeDir!==0){ fade+=fadeDir*dt*2.6; if(fade>=1){fade=1;} if(fade<=0){fade=0;fadeDir=0;} }

  if(mode==='title'){
    drawTitle();
    if(pr('a')){ sfx.ok(); mode='intro'; pagei=0; }
  }
  else if(mode==='intro'){
    drawPages(INTRO,'~ THE FESTIVAL OF THE TRUCE ~');
    if(pr('a')){ sfx.cursor(); pagei++; if(pagei>=INTRO.length){ mode='world'; fade=1; fadeDir=-1; setCam(); } }
  }
  else if(mode==='world'){ updateWorld(dt); if(mode==='world'||mode==='battleIn'||mode==='swap') drawScene(); else if(mode==='dialog') drawDialog(); }
  else if(mode==='dialog'){ drawDialog(); updateDialog(); }
  else if(mode==='swap'){ drawScene(); }
  else if(mode==='battleIn'){
    drawScene();
    swirl+=dt*2.4;
    g.save(); g.translate(VIEW_W/2,VIEW_H/2);
    for(let i=0;i<10;i++){
      g.fillStyle='rgba(8,2,18,'+Math.min(1,swirl)+')';
      g.save(); g.rotate(swirl*3+i*0.628);
      g.fillRect(0,-30,VIEW_W,60); g.restore();
    }
    g.restore();
    if(swirl>=1){
      const f=pendingBattle; pendingBattle=null;
      startBattle(f.group,f);
    }
  }
  else if(mode==='battle'){ updateBattle(dt); if(battle) drawBattle(); }
  else if(mode==='ending'){
    drawPages(ENDING, pagei===ENDING.length-1?'~ FIN ~':'~ THE ROAD HOME ~');
    if(pagei===ENDING.length-1){
      dogSprite(VIEW_W/2-46,400,{breed:'corgi',fur:FUR.corgi,wear:'#2a7a3a'},'down',tGlobal*0.4,2.5);
      dogSprite(VIEW_W/2+46,400,{breed:'shiba',fur:FUR.shiba,wear:'#383a6a',sword:true},'down',tGlobal*0.4,2.5);
    }
    if(pr('a')){ sfx.cursor(); pagei++;
      if(pagei>=ENDING.length){ resetGame(); mode='title'; } }
  }
  else if(mode==='gameover'){
    drawGameover();
    if(pr('a')){
      sfx.ok();
      era='present'; curMap='world'; player.x=6*T+16; player.y=10*T+16;
      healParty(); mode='world'; fade=1; fadeDir=-1; setCam();
    }
  }

  if(toastT>0 && mode!=='title'){
    g.font='bold 14px monospace'; g.textAlign='center';
    const w=g.measureText(toastMsg).width+32;
    winBox(VIEW_W/2-w/2,28,w,32);
    g.fillStyle=C.gold; g.fillText(toastMsg,VIEW_W/2,49);
  }
  if(fade>0){ g.fillStyle='rgba(248,250,255,'+fade+')'; g.fillRect(0,0,VIEW_W,VIEW_H); }

  for(const k in hit) hit[k]=false;
  requestAnimationFrame(frame);
}
function resetGame(){
  era='present'; curMap='world'; player.x=6*T+16; player.y=10*T+16; player.dir='down';
  party=[mkHero('pip','PIP','corgi','#2a7a3a',72,10,12,1.0)];
  inv={kibble:4,biscuit:1}; gold=25;
  Object.keys(flags).forEach(k=>flags[k]=false);
  spawnFoes(); buildNPCs(); setCam();
}
setCam();
requestAnimationFrame(frame);
</script>
